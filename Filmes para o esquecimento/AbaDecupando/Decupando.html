<!DOCTYPE html>
<html lang="en">
 <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="decupando.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <title> Filmes para o esquecimento </title>
    </head>
    <body> 
        <header class="content">
            <div class="logo">
               <img src="../Filmes para o esquecimento/img/branco1.png" width="175" height="46">
            </div>
            <nav class="navbar">
               <ul class="nav_list">
                 <li class="nav_item">
                    <a href="#home"> Início </a>
                 </li>
                  <li class="nav_item">
                    <a href="#"> Projetos </a>
                 </li>
                 <li class="nav_item">
                    <a href="#sobre"> Sobre </a>
                 </li>
               </ul>
            </nav>
        </header>

        <section class="filmes" id="filmes">

  <h2 class="titulo-filmes">Filmes</h2>

  <div class="cartazes">

    <div class="cartaz">
      <img src="../post.png">
      <h3>Decupando - Silva Barros </h3>
      <p>Direção: Liedson Lima e Adilio Moreno</p>
    </div>

    <div class="cartaz">
      <img src="https://www.cinesud-affiches.com/7109-thickbox_default/o-cangaceiro-affiche-film.jpg">
      <h3>Decupando -  XXXXXXXXXX </h3>
      <p>Direção: Adílio Moreno, Liédson Lima</p>
    </div>

    <div class="cartaz">
      <img src="https://www.cinesud-affiches.com/7109-thickbox_default/o-cangaceiro-affiche-film.jpg">
      <h3>Decupando -  XXXXXXXXXX </h3>
      <p>Direção: Adílio Moreno, Liédson Lima</p>
    </div>

  </div>
</section>

<script>
  const header = document.querySelector('.content');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
</script>

</body>
</html>
